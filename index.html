<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<title>我的主页</title>
<link rel="icon" href="assets/avatar/avatar.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" id="bg"><div class="bg-img is-active" id="bgA"></div><div class="bg-img" id="bgB"></div><div class="bg-mask"></div></div>
<canvas class="fx-canvas" id="fxParticles"></canvas><canvas class="fx-canvas" id="fxCursor"></canvas><canvas class="fx-canvas" id="fxClick"></canvas>
<main class="page" id="page">
  <section class="hero">
    <div class="avatar-wrap" id="avatarWrap"><img class="avatar" id="avatar" alt="头像"></div>
    <h1 class="big-title" id="bigTitle"></h1>
    <p class="subtitle"><span id="typewriter"></span><i class="caret" id="caret">|</i></p>
    <div class="info-row"><span class="chip" id="greeting"></span><span class="chip" id="clock"></span><span class="chip" id="weather"></span></div>
    <p class="hitokoto" id="hitokoto"></p>
    <form class="search" id="searchForm">
      <div class="engine" id="engineWrap"><button type="button" class="engine-current" id="engineCurrent"><span id="engineName">搜索</span><svg viewBox="0 0 24 24" class="ico-chev"><polyline points="6 9 12 15 18 9"/></svg></button><ul class="engine-list" id="engineList"></ul></div>
      <input class="search-input" id="searchInput" type="search" placeholder="搜索任何你感兴趣的东西…" autocomplete="off">
      <button class="search-btn" type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" class="ico-search"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button>
    </form>
  </section>
  <section class="showcase" id="showcase"></section>
  <footer class="footer" id="footer"><div class="social" id="social"></div><p class="footer-text" id="footerText"></p><p class="visit" id="visitCount"></p></footer>
</main>
<section class="player" id="player"><canvas class="spectrum" id="spectrum"></canvas><div class="player-main">
<button class="pbtn" id="btnPrev">‹</button><button class="pbtn pbtn-play" id="btnPlay"><span class="ico-play">▶</span><span class="ico-pause">Ⅱ</span></button><button class="pbtn" id="btnNext">›</button>
<div class="track"><div class="track-name" id="trackName">未播放</div><div class="track-bar"><span class="time" id="timeCurrent">00:00</span><input class="range" id="progress" type="range" min="0" max="1000" value="0"><span class="time" id="timeDuration">00:00</span></div></div>
<div class="vol"><span>🔊</span><input class="range range-vol" id="volume" type="range" min="0" max="100" value="40"></div><button class="pbtn" id="btnList">☰</button></div><ul class="playlist" id="playlist"></ul></section>
<div class="ctx-menu" id="ctxMenu"></div><audio id="audio" preload="metadata"></audio>
<script src="js/config.js"></script><script src="js/effects.js"></script><script src="js/main.js"></script>
</body></html>
