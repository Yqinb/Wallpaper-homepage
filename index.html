<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端适配：viewport-fit=cover 用于适配刘海屏安全区域 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="renderer" content="webkit">
  <meta name="theme-color" content="#0b1020">

  <!-- SEO 信息：以下四项会由 js/main.js 读取 config.js 后自动覆盖 -->
  <meta name="description" content="一个简洁美观的纯前端个人主页">
  <meta name="keywords" content="个人主页,前端,作品集">
  <meta name="author" content="Your Name">
  <title>我的主页</title>

  <!-- 网站图标 -->
  <link rel="icon" href="assets/avatar/avatar.png">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ============================ 页面加载动画 ============================ -->
<div class="loader" id="loader">
  <div class="loader-box">
    <div class="loader-ring"></div>
    <div class="loader-text">Loading</div>
  </div>
</div>

<!-- ============================ 背景层 ============================ -->
<!-- 两张背景图交替淡入淡出，实现无缝切换 -->
<div class="bg" id="bg">
  <div class="bg-img is-active" id="bgA"></div>
  <div class="bg-img" id="bgB"></div>
  <div class="bg-mask" id="bgMask"></div>
</div>

<!-- ============================ 特效 Canvas 层 ============================ -->
<!-- 环境粒子（雪花/樱花/星空/气泡） -->
<canvas class="fx-canvas" id="fxParticles"></canvas>
<!-- 鼠标跟随特效（PC 端） -->
<canvas class="fx-canvas" id="fxCursor"></canvas>
<!-- 点击特效（PC + 移动端） -->
<canvas class="fx-canvas" id="fxClick"></canvas>

<!-- ============================ 主内容区 ============================ -->
<div class="page" id="page">

  <!-- 展示栏插槽：主内容上方 -->
  <div class="slot" id="slotAbove"></div>

  <main class="hero">
    <!-- 头像 -->
    <div class="avatar-wrap">
      <img class="avatar" id="avatar" alt="头像">
    </div>

    <!-- 大标题 -->
    <h1 class="big-title" id="bigTitle"></h1>

    <!-- 小标题 / 打字机 -->
    <p class="subtitle">
      <span id="typewriter"></span><i class="caret" id="caret">|</i>
    </p>

    <!-- 问候语 / 时钟 / 天气 -->
    <div class="info-row">
      <span class="chip" id="greeting"></span>
      <span class="chip" id="clock"></span>
      <span class="chip" id="weather"></span>
    </div>

    <!-- 一言 -->
    <p class="hitokoto" id="hitokoto"></p>

    <!-- 搜索栏 -->
    <form class="search" id="searchForm" autocomplete="off">
      <div class="engine" id="engineWrap">
        <button type="button" class="engine-current" id="engineCurrent">
          <span id="engineName">百度</span>
          <svg viewBox="0 0 24 24" class="ico-chev" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <ul class="engine-list" id="engineList"></ul>
      </div>

      <input class="search-input" id="searchInput" type="text" placeholder="搜索…" aria-label="搜索内容">

      <button class="search-btn" id="searchBtn" type="submit" aria-label="搜索">
        <svg viewBox="0 0 24 24" class="ico-search" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
      </button>
    </form>
  </main>

  <!-- 展示栏插槽：主内容下方（搜索栏下方） -->
  <div class="slot" id="slotBelow"></div>

  <!-- 展示栏插槽：页面底部 -->
  <div class="slot" id="slotBottom"></div>

  <!-- ============================ 页脚 ============================ -->
  <footer class="footer" id="footer">
    <div class="social" id="social"></div>
    <p class="footer-text" id="footerText"></p>
    <p class="visit" id="visitCount"></p>
  </footer>
</div>

<!-- ============================ BGM 播放器 ============================ -->
<div class="player" id="player">
  <!-- 频谱可视化 -->
  <canvas class="spectrum" id="spectrum"></canvas>

  <div class="player-main">
    <button class="pbtn" id="btnPrev" type="button" aria-label="上一首">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="19 20 9 12 19 4 19 20"></polygon>
        <line x1="5" y1="4" x2="5" y2="20"></line>
      </svg>
    </button>

    <button class="pbtn pbtn-play" id="btnPlay" type="button" aria-label="播放/暂停">
      <svg viewBox="0 0 24 24" class="ico-play" aria-hidden="true">
        <polygon points="6 4 20 12 6 20 6 4"></polygon>
      </svg>
      <svg viewBox="0 0 24 24" class="ico-pause" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
      </svg>
    </button>

    <button class="pbtn" id="btnNext" type="button" aria-label="下一首">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="4" x2="19" y2="20"></line>
      </svg>
    </button>

    <div class="track">
      <div class="track-name" id="trackName">未播放</div>
      <div class="track-bar">
        <span class="time" id="timeCurrent">00:00</span>
        <input class="range" id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度">
        <span class="time" id="timeDuration">00:00</span>
      </div>
    </div>

    <div class="vol">
      <svg viewBox="0 0 24 24" class="ico-vol" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      </svg>
      <input class="range range-vol" id="volume" type="range" min="0" max="100" value="45" aria-label="音量">
    </div>

    <button class="pbtn" id="btnList" type="button" aria-label="播放列表">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <circle cx="3.5" cy="6" r="1.2"></circle>
        <circle cx="3.5" cy="12" r="1.2"></circle>
        <circle cx="3.5" cy="18" r="1.2"></circle>
      </svg>
    </button>
  </div>

  <!-- 播放列表（可展开） -->
  <ul class="playlist" id="playlist"></ul>
</div>

<!-- ============================ 自定义右键菜单 ============================ -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- ============================ 音频元素 ============================ -->
<audio id="audio" preload="metadata"></audio>

<!-- ============================ 脚本（顺序不可调换） ============================ -->
<script src="js/config.js"></script>
<script src="js/effects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
